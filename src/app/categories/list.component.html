<div class="container">
  <h5 class="text-center mt-3">CATEGORIES</h5>
  <div class="d-flex my-2">
    <a href="#" routerLink="/categories/add" class="btn btn-outline-success ms-auto">Create New Category</a>
  </div>
  <div class="table-responsive">
    <table class="table table-bordered p-0 m-0">
      <thead>
      <tr>
        <th scope="col">#</th>
        <th scope="col">Title</th>
        <th scope="col">Description</th>
      </tr>
      </thead>
      <tbody>
      <tr scope="row" *ngFor="let category of categories">
        <td>{{ category?.id }}</td>
        <td>{{ category?.title }}</td>
        <td>{{ category?.description }}</td>
        <td><a href="#" [routerLink]="['/categories/', category.id, 'view']" class="btn btn-info m-1">View</a> <a
          href="#"
          [routerLink]="['/categories/', category.id, 'edit']" class="btn btn-primary m-1">Edit</a>
          <button type="button" (click)="openDialog(category.id)" class="btn btn-danger m-1">Delete</button>
        </td>
      </tr>
      <tr scope="row" *ngIf="categories.length === 0">
        <td colspan="6" class="text-center">No record found</td>
      </tr>
      </tbody>
    </table>
    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" [pageSize]="5" [length]="totalElements"
                   (page)="nextPage($event)"></mat-paginator>
  </div>
</div>
