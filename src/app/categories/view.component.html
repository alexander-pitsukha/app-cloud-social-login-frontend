<div class="container">
  <h5 class="text-center">CATEGORY DETAILS</h5>
  <div class="table-responsive">
    <table class="table table-bordered p-0 m-0">
      <tbody>
      <tr scope="row">
        <th>ID</th>
        <td>{{ category?.id }}</td>
      </tr>
      <tr scope="row">
        <th>Title</th>
        <td>{{ category?.title }}</td>
      </tr>
      <tr scope="row">
        <th>Description</th>
        <td>{{ category?.description }}</td>
      </tr>
      </tbody>
    </table>
  </div>
  <div class="d-flex">
    <a href="#" routerLink="/categories/list" class="btn btn-primary mt-2 w-100">Back</a>
  </div>
</div>
